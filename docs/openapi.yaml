openapi: 3.1.0
info:
  title: file-processor
  version: 1.0.0
  description: |
    Concurrent processor for POS sales transaction CSV files. Clients submit
    files that already sit in the server's data directory, poll the job, and
    read the per-file report and the daily sales results once it has finished.
    There is no authentication.
    Every error, including unknown routes (404) and unsupported methods
    (405, with an `Allow` header), is an RFC 9457 `application/problem+json` body.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: healthz
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /openapi.yaml:
    get:
      summary: This specification
      operationId: openapi
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /jobs:
    post:
      summary: Submit a processing job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            example:
              files: [outlets/jakarta-2026-10-30.csv, outlets/bandung-2026-10-30.csv]
      responses:
        "202":
          description: The job was accepted and queued.
          headers:
            Location:
              description: URL of the new job.
              schema:
                type: string
                example: /jobs/7b0e5f9e-2c1f-4c35-9d4e-1f2a3b4c5d6e
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateJobResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          description: The job queue is full or the server is shutting down.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      summary: Job status and live progress
      operationId: getJob
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /jobs/{id}/report:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      summary: Per-file report of a finished job
      operationId: getJobReport
      responses:
        "200":
          description: One entry per submitted file, in submission order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /jobs/{id}/results:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      summary: Daily sales of a finished job
      operationId: getJobResults
      responses:
        "200":
          description: Totals and daily sales. Empty for a cancelled or failed job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Results"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Paths relative to the data directory. Absolute paths, `..`, symlinks that leave the data directory, and non-regular files are rejected. A file that does not exist is accepted and reported as failed.
          items:
            type: string
    CreateJobResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: queued
    JobStatus:
      type: string
      enum: [queued, running, completed, cancelled, failed]
    FileStatus:
      type: string
      enum: [ok, ok_with_errors, partial, failed, cancelled]
    Job:
      type: object
      required: [id, status, created_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        error:
          type: string
          description: Why the job failed.
        progress:
          $ref: "#/components/schemas/Progress"
    Progress:
      type: object
      description: Present only while the job is running.
      required: [files_done, files_total, percent, bytes_read, bytes_total, valid, invalid, elapsed_ms]
      properties:
        files_done:
          type: integer
        files_total:
          type: integer
        percent:
          type: [number, "null"]
          description: Byte-based; null when no file size is known.
        bytes_read:
          type: integer
        bytes_total:
          type: integer
        valid:
          type: integer
        invalid:
          type: integer
        elapsed_ms:
          type: integer
    RowError:
      type: object
      required: [line, kind, message]
      properties:
        line:
          type: integer
        column:
          type: string
        kind:
          type: string
          enum: [csv_syntax, field_count, missing_field, invalid_number, invalid_date, other]
        message:
          type: string
    File:
      type: object
      required: [path, status, valid, invalid, error_counts, errors, last_line]
      properties:
        path:
          type: string
          description: Relative to the data directory.
        status:
          $ref: "#/components/schemas/FileStatus"
        valid:
          type: integer
        invalid:
          type: integer
        error_counts:
          type: object
          additionalProperties:
            type: integer
        errors:
          type: array
          maxItems: 100
          description: The row errors with the lowest line numbers.
          items:
            $ref: "#/components/schemas/RowError"
        error:
          type: string
        last_line:
          type: integer
        close_error:
          type: string
    Report:
      type: object
      required: [job_id, status, files]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
    Totals:
      type: object
      required: [transactions, quantity, amount]
      properties:
        transactions:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
          description: Smallest currency unit (rupiah).
    Daily:
      type: object
      required: [date, outlet_id, product_id, transactions, quantity, amount]
      properties:
        date:
          type: string
          format: date
          description: Calendar date in the offset written in the transaction.
        outlet_id:
          type: string
        product_id:
          type: string
        transactions:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
    Results:
      type: object
      required: [job_id, status, totals, daily]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        totals:
          $ref: "#/components/schemas/Totals"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/Daily"
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
