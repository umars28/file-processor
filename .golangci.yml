version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  exclusions:
    rules:
      - path: ^internal/cli/
        linters:
          - errcheck
        text: "Error return value of `fmt\\.Fprint(f|ln)?` is not checked"
      - path: _test\.go$
        linters:
          - gosec
        text: "^G(204|404):"

formatters:
  enable:
    - gofmt
    - goimports
